[project]
name = "maritime-intelligence"
version = "0.1.0"
description = "Maritime Intelligence & Anomaly Detection Platform (MIADP): an educational AIS analytics portfolio project"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Sean Tessman" }]
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "pyarrow>=16",
    "sqlalchemy>=2.0.30,<2.1",
    "psycopg[binary]>=3.1.19,<4",
    "alembic>=1.13",
    "geoalchemy2>=0.15",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "networkx>=3.3",
    "joblib>=1.4",
    "pyyaml>=6.0",
    "streamlit>=1.38",
    "plotly>=5.22",
    "pydeck>=0.9",
    "fastapi>=0.112",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "requests>=2.32",
    "reportlab>=4.2",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "playwright>=1.45",
    "nbformat>=5.10",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
    "matplotlib>=3.9",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "S608", "B008", "E501"]  # E501: ruff format owns line length

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "E501"]
"alembic/versions/**" = ["E501"]
"scripts/**" = ["S603", "S607"]
"tasks.py" = ["S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: requires a running PostgreSQL/PostGIS database (see docs/deployment.md)",
]
addopts = "-ra"

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["maritime", "api"]
